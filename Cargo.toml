[package]
name = "ledger-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
libc = "0.2"
rocksdb = "0.25.0"
tokio = {
    version = "1",
    features = [
        "fs",
        "io-std",
        "io-util",
        "macros",
        "net",
        "rt",
        "rt-multi-thread",
        "signal",
        "sync",
        "time",
    ],
}

[[bench]]
name = "counter_storage"
harness = false

[[bench]]
name = "bounded_queue_hashmap"
harness = false

[[bench]]
name = "bounded_queue_hashmap_tokio"
harness = false

[[bench]]
name = "bounded_queue_batch_pool_tokio"
harness = false

[[bench]]
name = "bounded_queue_request_ring_tokio"
harness = false

[[bench]]
name = "ledger_pipeline_tokio"
harness = false

[[bench]]
name = "ledger_pipeline_sharding_tokio"
harness = false

[[bench]]
name = "ledger_index_lookup_tokio"
harness = false

[[bench]]
name = "ledger_thread_scaling_tokio"
harness = false

[[bench]]
name = "ledger_time_boundary_tokio"
harness = false

[[bench]]
name = "ledger_account_store_tokio"
harness = false

[[bench]]
name = "ledger_account_store_sharding_tokio"
harness = false

[[bench]]
name = "ledger_projection_worker_tokio"
harness = false

[[bench]]
name = "ledger_request_batch_tokio"
harness = false

[[bench]]
name = "ledger_safe_gc_tokio"
harness = false

[[bench]]
name = "wal_sync"
harness = false

[[bench]]
name = "wal_tokio_sequential"
harness = false

[[bench]]
name = "rocksdb_tokio_sequential"
harness = false

[[bench]]
name = "rocksdb_tokio_parallel_query"
harness = false

[[bench]]
name = "grpc_echo_loopback"
harness = false

[[bench]]
name = "ledger_core_pipeline"
harness = false

[dev-dependencies]
cpu-time = "1.0.0"
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
