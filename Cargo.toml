[package]
name = "ledger-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[[bench]]
name = "counter_storage"
harness = false

[[bench]]
name = "bounded_queue_hashmap"
harness = false

[[bench]]
name = "bounded_queue_hashmap_tokio"
harness = false

[[bench]]
name = "bounded_queue_batch_pool_tokio"
harness = false

[[bench]]
name = "wal_sync"
harness = false

[[bench]]
name = "wal_tokio_sequential"
harness = false

[[bench]]
name = "rocksdb_tokio_sequential"
harness = false

[[bench]]
name = "rocksdb_tokio_parallel_query"
harness = false

[[bench]]
name = "grpc_echo_loopback"
harness = false

[dev-dependencies]
cpu-time = "1.0.0"
libc = "0.2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
rocksdb = "0.25.0"
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
