[package]
name = "ledger-txn-sweep"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "txn_batch_pg"
path = "src/bin/txn_batch_pg.rs"

[[bin]]
name = "txn_batch_tidb"
path = "src/bin/txn_batch_tidb.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = { version = "7", features = ["serialization"] }
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
