[package]
name = "ledger-wallet-scylla-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
async-trait = "0.1"
cpu-time = "1"
futures = "0.3"
hdrhistogram = "7"
libc = "0.2"
scylla = { version = "=1.9.0", features = ["metrics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "=0.7.18"
